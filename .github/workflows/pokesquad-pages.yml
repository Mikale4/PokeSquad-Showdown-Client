# PokeSquad Battler's Showdown site on GitHub Pages: the client built (node build) and play.pokemonshowdown.com/ served, with
# pokesquad.html (PokeSquad's settings: its server, names without a login) as the home page.
name: PokeSquad Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node build
      - name: The site, with PokeSquad's page as the home page
        # (copied without the repo's symlinks: they point at server config files a static site doesn't have)
        run: |
          mkdir _site
          cp -r play.pokemonshowdown.com/. _site/
          find _site -type l -delete
          cp _site/pokesquad.html _site/index.html
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
